<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pemesanan - Meja Cafe Palu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #ff7a1a;
      --primary-dark: #f26a00;
      --bg-body: #f3f5fb;
      --card-bg: #ffffff;
      --border: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --radius-lg: 20px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
    }

    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body{
      background: var(--bg-body);
      min-height: 100vh;
    }

    .page-wrapper{
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .brand{
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.1em;
      margin-bottom: 18px;
    }

    .form-card{
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      padding: 26px 28px 30px;
    }

    .form-title{
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-main);
    }

    .form-subtitle{
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .row{
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .form-group{
      margin-bottom: 14px;
    }

    label{
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #374151;
    }

    input[type="text"],
    input[type="tel"],
    select,
    textarea{
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      transition: 0.15s;
      background: #f9fafb;
    }

    input:focus,
    select:focus,
    textarea:focus{
      border-color: #4f46e5;
      box-shadow: 0 0 0 1px rgba(79,70,229,0.14);
      background: #ffffff;
    }

    textarea{
      resize: vertical;
      min-height: 80px;
    }

    .hint{
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .btn-submit{
      width: 100%;
      border-radius: 999px;
      border: none;
      margin-top: 18px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(90deg,#ffa337,#ff7a1a);
      box-shadow: 0 18px 35px rgba(249,115,22,0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:active{
      transform: translateY(1px);
      box-shadow: 0 10px 22px rgba(249,115,22,0.45);
    }

    .footer-note{
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    .summary-box{
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 14px;
      background: #f9fafb;
      font-size: 13px;
      border: 1px dashed #e5e7eb;
    }

    .summary-title{
      font-weight: 600;
      margin-bottom: 4px;
    }

    .summary-price{
      margin-top: 6px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
    }

    @media (max-width: 768px){
      .form-card{ padding: 22px 18px 26px; }
      .row{ grid-template-columns: 1fr; }
      .page-wrapper{ padding-inline: 10px; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="brand">MEJA CAFE PALU</div>

  <div class="form-card">
    <div class="form-title">Form Pemesanan</div>
    <div class="form-subtitle">
      Isi data di bawah, pesanan akan masuk ke sistem Owner (database PHP/MySQL).
    </div>

    <!-- FORM SEKARANG KIRIM KE PHP -->
    <form id="orderForm" action="save_order.php" method="POST">
      <!-- NAMA & WHATSAPP -->
      <div class="row">
        <div class="form-group">
          <label>Nama</label>
          <input type="text" id="customer_name" name="customer_name"
                 placeholder="Nama lengkap" required>
        </div>

        <div class="form-group">
          <label>No. WhatsApp</label>
          <input type="tel" id="customer_phone" name="customer_phone"
                 placeholder="0852xxxxxxx" required>
          <div class="hint">Gunakan angka saja, boleh diawali 08 atau 62.</div>
        </div>
      </div>

      <!-- ALAMAT -->
      <div class="form-group">
        <label>Alamat Lengkap</label>
        <textarea id="customer_address" name="customer_address"
                  placeholder="Nama jalan, RT/RW, kelurahan, kecamatan, kota/kabupaten"
                  required></textarea>
      </div>

      <!-- CATATAN -->
      <div class="form-group">
        <label>Catatan (Opsional)</label>
        <textarea id="notes" name="notes"
                  placeholder="Contoh: warna rangka putih, kirim sore, dsb."></textarea>
      </div>

      <!-- RINGKASAN -->
      <div class="summary-box">
        <div class="summary-title">Ringkasan Pesanan</div>
        <div id="summaryProduct">Keranjang masih kosong.</div>
        <div id="summaryQty"></div>
        <div class="summary-price" id="summaryTotal">Total: Rp 0</div>
      </div>

      <!-- HIDDEN UNTUK DIKIRIM KE PHP -->
      <input type="hidden" id="items_summary" name="items_summary">
      <input type="hidden" id="total_amount" name="total_amount">

      <button type="submit" class="btn-submit">
        Kirim Pesanan ke Admin
      </button>

      <div class="footer-note">
        * Admin akan menghubungi kembali melalui WhatsApp setelah pesanan masuk ke sistem.
      </div>
    </form>
  </div>
</div>

<script>
  // ====== BACA DATA KERANJANG DARI LOCALSTORAGE ======
  const cartPayload = JSON.parse(localStorage.getItem('MEJA_CAFE_CART') || '{}');
  const cartItems   = cartPayload.cart  || [];
  let   totalAmount = cartPayload.total || 0;

  function formatRupiah(num) {
    return "Rp " + (Number(num) || 0).toLocaleString("id-ID");
  }

  function renderSummary() {
    const summaryProduct = document.getElementById("summaryProduct");
    const summaryQty     = document.getElementById("summaryQty");
    const summaryTotal   = document.getElementById("summaryTotal");

    if (!cartItems.length) {
      summaryProduct.textContent = "Keranjang masih kosong.";
      summaryQty.textContent     = "";
      summaryTotal.textContent   = "Total: Rp 0";
      totalAmount = 0;
      return;
    }

    const names    = cartItems.map(i => i.name);
    const totalQty = cartItems.reduce((sum, i) => sum + i.quantity, 0);

    summaryProduct.textContent = `${totalQty} item: ${names.join(", ")}`;
    summaryQty.textContent     = "";
    summaryTotal.textContent   = "Total: " + formatRupiah(totalAmount);
  }

  // bikin teks detail keranjang buat disimpan ke DB
  function buildCartText() {
    if (!cartItems.length) return "";
    let cartText = "";
    cartItems.forEach((item, idx) => {
      const subtotal = item.price * item.quantity;
      cartText += `${idx + 1}. ${item.name} | Qty: ${item.quantity} | Harga: ${formatRupiah(item.price)} | Subtotal: ${formatRupiah(subtotal)}\n`;
    });
    cartText += `\nTOTAL: ${formatRupiah(totalAmount)}\n`;
    const notes = document.getElementById("notes").value.trim();
    if (notes) cartText += `Catatan: ${notes}`;
    return cartText;
  }

  renderSummary();

  // ====== SUBMIT KE save_order.php ======
  const form = document.getElementById("orderForm");

  form.addEventListener("submit", function(e) {
    if (!cartItems.length) {
      e.preventDefault();
      alert("Keranjang masih kosong. Silakan kembali ke halaman utama dan pilih produk.");
      return;
    }

    // isi hidden sebelum form dikirim
    document.getElementById("items_summary").value = buildCartText();
    document.getElementById("total_amount").value  = totalAmount || 0;
    // setelah ini form lanjut submit normal ke PHP
  });
</script>
</body>
</html>
